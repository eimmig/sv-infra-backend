name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Changelog
      - name: Validar atualizacao do CHANGELOG.md
        if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/validate-changelog.sh CHANGELOG.md

      # 2. Build
      - name: Validar docker-compose.yml
        run: docker compose config

      # 3. SonarCloud
      - name: SonarCloud
        if: (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')) || (github.event_name == 'push' && github.ref_name == 'main')
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4.2.2
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            ${{ github.event_name != 'push' && '-Dsonar.qualitygate.wait=true' || '' }}

      # 4. Gate de issue/hotspot do SonarCloud
      - name: Validar zero issues no SonarCloud
        if: (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')) || (github.event_name == 'push' && github.ref_name == 'main')
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          python3 .github/scripts/validate-sonar-issues.py
          --project-key eimmig_sv-infra-backend
          ${{ github.event_name == 'pull_request' && format('--pull-request {0}', github.event.pull_request.number) || format('--branch {0}', github.ref_name) }}

  release:
    needs: pipeline
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Calcular proxima versao (Conventional Commits)
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          noVersionBumpBehavior: patch

      - name: Cortar CHANGELOG.md
        run: python3 .github/scripts/cut-changelog.py CHANGELOG.md ${{ steps.semver.outputs.nextStrict }}

      - name: Commit e push da release
        id: release-commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEXT_VERSION: ${{ steps.semver.outputs.next }}
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $NEXT_VERSION [skip ci]"
            git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Criar tag e GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          commit: ${{ steps.release-commit.outputs.sha }}
          token: ${{ github.token }}
          generateReleaseNotes: true

# Copie para secret.yaml (nunca versionado - ver .gitignore) e preencha os valores reais,
# mesmos ja usados nos .env de cada servico (ADMIN_API_KEY/PASETO_LOCAL_KEY/SERVICE_KEY
# precisam ser identicos aos dos .env locais - ver docs/OBSERVABILITY-AND-CONFIG.md e
# infra/CLAUDE.md). `kubectl apply -f k8s/secret.yaml` antes de qualquer outro manifest.
apiVersion: v1
kind: Secret
metadata:
  name: stakevault-secrets
type: Opaque
stringData:
  POSTGRES_AUTH_PASSWORD: CHANGE_ME
  POSTGRES_BETS_PASSWORD: CHANGE_ME
  POSTGRES_STATS_PASSWORD: CHANGE_ME
  RABBITMQ_USER: CHANGE_ME
  RABBITMQ_PASSWORD: CHANGE_ME
  REDIS_PASSWORD: CHANGE_ME
  N8N_ENCRYPTION_KEY: CHANGE_ME
  # Mesma chave em auth-service e api-gateway (quem emite/valida o token PASETO).
  PASETO_LOCAL_KEY: CHANGE_ME
  # Mesmo valor em auth-service/bets-service/stats-service (rota admin de tenant).
  ADMIN_API_KEY: CHANGE_ME
  # Mesmo valor em api-gateway e telegram-integration (chamada sem usuario logado).
  SERVICE_KEY: CHANGE_ME

# RabbitMQ + Job one-shot que aplica a topologia (rabbitmq/definitions.json - mesmo arquivo
# usado por docker-compose, montado aqui via ConfigMap em vez de bind mount). Sem
# depends_on/condition: service_healthy do compose - o Job usa um initContainer que espera a
# porta AMQP responder antes de rodar o mesmo apply-definitions.sh de sempre.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: management }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: RABBITMQ_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_running", "--quiet"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_running", "--quiet"] }
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rabbitmq-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
---
# O ConfigMap "rabbitmq-definitions" NAO esta neste arquivo de proposito: embedar
# rabbitmq/definitions.json e rabbitmq/apply-definitions.sh como texto YAML duplicaria os
# arquivos que docker-compose.yml ja usa (bind mount) e divergiria se um mudasse sem o outro.
# Gerar (idempotente) a partir dos mesmos 2 arquivos, sempre antes do restante deste diretorio:
#   kubectl create configmap rabbitmq-definitions \
#     --from-file=rabbitmq/definitions.json --from-file=rabbitmq/apply-definitions.sh \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-init
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]
      containers:
        - name: apply-definitions
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "/scripts/apply-definitions.sh"]
          env:
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: RABBITMQ_PASSWORD } }
          volumeMounts:
            - { name: definitions, mountPath: /definitions.json, subPath: definitions.json }
            - { name: definitions, mountPath: /scripts/apply-definitions.sh, subPath: apply-definitions.sh }
      volumes:
        - name: definitions
          configMap: { name: rabbitmq-definitions }

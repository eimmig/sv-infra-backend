# Tres instancias PostgreSQL, uma por servico de aplicacao (Database per Service - mesmo
# isolamento de infra/docker-compose.yml, aqui como 3 Deployments/Services/PVCs distintos em
# vez de 3 containers na mesma rede bridge). Sem StatefulSet: um unico pod cada, identidade de
# rede ja vem do Service (nome DNS estavel), sem necessidade de indice ordinal/volume por
# replica que justificasse o StatefulSet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-auth }
  template:
    metadata:
      labels: { app: postgres-auth }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: auth }
            - { name: POSTGRES_USER, value: auth_user }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: POSTGRES_AUTH_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "auth_user", "-d", "auth"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "auth_user", "-d", "auth"] }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-auth-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-auth-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
spec:
  selector: { app: postgres-auth }
  ports: [{ port: 5432, targetPort: 5432 }]
---

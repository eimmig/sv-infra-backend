apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres-auth }
  template:
    metadata:
      labels: { app: postgres-auth }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: auth }
            - { name: POSTGRES_USER, value: auth_user }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: POSTGRES_AUTH_PASSWORD } }
          resources:
            requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 128Mi }
            limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "auth_user", "-d", "auth"] }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "auth_user", "-d", "auth"] }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-auth-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-auth-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
spec:
  selector: { app: postgres-auth }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-bets
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres-bets }
  template:
    metadata:
      labels: { app: postgres-bets }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          args: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1GB"]
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: bets }
            - { name: POSTGRES_USER, value: bets_user }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: POSTGRES_BETS_PASSWORD } }
          resources:
            requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 128Mi }
            limits: { cpu: 2000m, memory: 2Gi, ephemeral-storage: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "bets_user", "-d", "bets"] }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "bets_user", "-d", "bets"] }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-bets-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-bets-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-bets
spec:
  selector: { app: postgres-bets }
  ports: [{ port: 5432, targetPort: 5432 }]
---

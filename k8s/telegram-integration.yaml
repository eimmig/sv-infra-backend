apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-integration
spec:
  replicas: 1
  selector:
    matchLabels: { app: telegram-integration }
  template:
    metadata:
      labels: { app: telegram-integration }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: telegram-integration
          image: ghcr.io/eimmig/sv-telegram-integration-backend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8000 }]
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: REDIS_PASSWORD } }
            - { name: AUTH_SERVICE_URL, value: "http://auth-service:8081" }
            - { name: API_GATEWAY_URL, value: "http://api-gateway:8080" }
            - name: SERVICE_KEY
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: SERVICE_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-integration
spec:
  selector: { app: telegram-integration }
  ports: [{ port: 8000, targetPort: 8000 }]

# Imagem publicada no GHCR (ghcr.io/eimmig/sv-bets-backend, services/bets-service/feat-015,
# job build-and-push-image no ci.yml daquele repositorio) - pacote privado, exige
# imagePullSecrets (ghcr-pull, criado uma vez via `kubectl create secret docker-registry`
# com um PAT classico escopo read:packages - ver infra/CLAUDE.md secao Kubernetes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bets-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: bets-service }
  template:
    metadata:
      labels: { app: bets-service }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: bets-service
          image: ghcr.io/eimmig/sv-bets-backend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8082 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: dev }
            - { name: DB_HOST, value: postgres-bets }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: bets }
            - { name: DB_USER, value: bets_user }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: POSTGRES_BETS_PASSWORD } }
            - name: ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: ADMIN_API_KEY } }
            - { name: RABBITMQ_HOST, value: rabbitmq }
            - { name: RABBITMQ_PORT, value: "5672" }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: RABBITMQ_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: bets-service
spec:
  selector: { app: bets-service }
  ports: [{ port: 8082, targetPort: 8082 }]

# Imagem publicada no GHCR (ghcr.io/eimmig/sv-api-gateway, services/api-gateway/feat-011,
# job build-and-push-image no ci.yml daquele repositorio) - pacote privado, exige
# imagePullSecrets (ghcr-pull, criado uma vez via `kubectl create secret docker-registry`
# com um PAT classico escopo read:packages - ver infra/CLAUDE.md secao Kubernetes). Unico
# servico exposto via Ingress (ver ingress.yaml) - ponto unico de entrada HTTP publico,
# mesmo desenho do diagrama de implantacao do TCC1 (API Gateway + Load Balancer/Ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api-gateway
          image: ghcr.io/eimmig/sv-api-gateway:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: dev }
            - name: PASETO_LOCAL_KEY
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: PASETO_LOCAL_KEY } }
            - { name: AUTH_SERVICE_URL, value: "http://auth-service:8081" }
            - { name: BETS_SERVICE_URL, value: "http://bets-service:8082" }
            - { name: STATS_SERVICE_URL, value: "http://stats-service:8083" }
            - name: SERVICE_KEY
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: SERVICE_KEY } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]

# Ponto unico de entrada HTTP publico do cluster (diagrama de implantacao do TCC1: "Load
# Balancer (Abstracao: Kubernetes Ingress/Service)" na frente do "API Gateway"). Dividido por
# path desde que o frontend (web, apps/web/feat-013) ganhou imagem propria: /api vai pro
# api-gateway (todas as rotas de negocio ja nascem com esse prefixo - /api/v1/..., ver
# docs/API-CONTRACTS.md - sem rewrite, o path chega intacto no gateway), o resto (/) vai pro
# web (SPA, fallback de rota tratado dentro do proprio nginx da imagem, nao aqui). Os demais
# servicos (auth/bets/stats/telegram-integration) so tem Service ClusterIP, alcancaveis
# apenas de dentro do cluster - nunca expostos aqui.
#
# TLS: acesso hoje e por IP puro na LAN (192.168.2.123, k3s de producao - sem dominio/DNS),
# entao nao ha CA publica (Let's Encrypt exige dominio) - secret web-tls-selfsigned gerado por
# k8s/tls/generate-dev-cert.sh (nunca versionado, so o script). Sem "hosts" no bloco tls: vira
# o certificado default deste Ingress para qualquer SNI, o que cobre acesso por IP (SNI vazio
# ou o proprio IP). Browser mostra aviso de cert nao confiavel na primeira visita (esperado,
# self-signed) - aceitar uma vez e suficiente; e o bastante pra crypto.randomUUID funcionar
# (exige secure context, que HTTPS satisfaz mesmo com cert nao confiavel).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stakevault-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: web-tls-selfsigned
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080

# Imagem local (stakevault/auth-service:local, servicos/auth-service/Dockerfile,
# feat-011 daquele repositorio) - carregada no cluster kind via
# `kind load docker-image stakevault/auth-service:local --name stakevault`, nunca puxada de
# um registry (imagePullPolicy: Never). Ver infra/CLAUDE.md secao Kubernetes para o passo a
# passo completo de build+load+apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: stakevault/auth-service:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: dev }
            - { name: DB_HOST, value: postgres-auth }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: auth }
            - { name: DB_USER, value: auth_user }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: POSTGRES_AUTH_PASSWORD } }
            - name: ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: ADMIN_API_KEY } }
            - name: PASETO_LOCAL_KEY
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: PASETO_LOCAL_KEY } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports: [{ port: 8081, targetPort: 8081 }]

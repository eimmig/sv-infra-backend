# Imagem publicada no GHCR (ghcr.io/eimmig/sv-auth-backend, services/auth-service/feat-014,
# job build-and-push-image no ci.yml daquele repositorio) - pacote privado, exige
# imagePullSecrets (ghcr-pull, criado uma vez via `kubectl create secret docker-registry`
# com um PAT classico escopo read:packages - ver infra/CLAUDE.md secao Kubernetes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: auth-service
          image: ghcr.io/eimmig/sv-auth-backend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: dev }
            - { name: DB_HOST, value: postgres-auth }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: auth }
            - { name: DB_USER, value: auth_user }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: POSTGRES_AUTH_PASSWORD } }
            - name: ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: ADMIN_API_KEY } }
            - name: PASETO_LOCAL_KEY
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: PASETO_LOCAL_KEY } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports: [{ port: 8081, targetPort: 8081 }]

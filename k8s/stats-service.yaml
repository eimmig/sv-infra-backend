# Imagem publicada no GHCR (ghcr.io/eimmig/sv-stats-backend, services/stats-service/feat-014,
# job build-and-push-image no ci.yml daquele repositorio) - pacote privado, exige
# imagePullSecrets (ghcr-pull, criado uma vez via `kubectl create secret docker-registry`
# com um PAT classico escopo read:packages - ver infra/CLAUDE.md secao Kubernetes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: stats-service }
  template:
    metadata:
      labels: { app: stats-service }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: stats-service
          image: ghcr.io/eimmig/sv-stats-backend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8083 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: dev }
            - { name: DB_HOST, value: postgres-stats }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: stats }
            - { name: DB_USER, value: stats_user }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: POSTGRES_STATS_PASSWORD } }
            - name: ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: ADMIN_API_KEY } }
            - { name: RABBITMQ_HOST, value: rabbitmq }
            - { name: RABBITMQ_PORT, value: "5672" }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: RABBITMQ_PASSWORD } }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: stakevault-secrets, key: REDIS_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: stats-service
spec:
  selector: { app: stats-service }
  ports: [{ port: 8083, targetPort: 8083 }]
